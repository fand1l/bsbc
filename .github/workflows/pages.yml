name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true вмикає Pages сам, без заходу в Settings
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # публікуємо лише сторінку, без .claude і службових файлів
      - name: Зібрати артефакт
        run: |
          mkdir -p _site
          cp index.html style.css app.js README.md _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
